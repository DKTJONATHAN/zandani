<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        try {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          localStorage.setItem('theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical path: match production theme so nothing unstyled flashes */
      html {
        color-scheme: dark;
        background-color: #050505;
      }
      body {
        margin: 0;
        background-color: #050505;
        color: #f3ece2;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      /* Hide React tree until JS marks html.app-ready (after first paint with CSS) */
      #root {
        min-height: 100vh;
        background: #050505;
        color: #f3ece2;
        opacity: 0;
      }
      html.app-ready #root {
        opacity: 1;
        transition: opacity 0.12s ease-out;
      }
      /* Full-screen branded shell while CSS + JS load */
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #050505;
        color: #f3ece2;
        pointer-events: none;
      }
      html.app-ready #boot-shell {
        display: none !important;
      }
      #boot-shell .boot-mark {
        width: 40px;
        height: 3px;
        background: #e85d04;
        border-radius: 2px;
      }
      #boot-shell .boot-title {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 0;
      }
      #boot-shell .boot-sub {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a9388;
      }
    </style>

    <script>
      function loadAds() {
        if (window._adsLoaded) return;
        window._adsLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9291176772735390';
        document.body.appendChild(s);
      }
      ['mousemove','scroll','keydown','touchstart','click'].forEach(function(e) {
        document.addEventListener(e, loadAds, { once: true, passive: true });
      });
      setTimeout(loadAds, 8000);
    </script>

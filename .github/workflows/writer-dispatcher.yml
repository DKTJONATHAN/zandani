name: Writer Dispatcher

# Manual / secondary path only. Primary clock is each desk's own simple
# schedule (August style). Keep this for "force desk" and emergency catch-up.

on:
  repository_dispatch:
    types: [newsroom-tick]
  workflow_dispatch:
    inputs:
      force_desk:
        description: "Force one desk: news, ghafla, mpasho, entertainment, africa, agriculture, business, lifestyle, opinions, sports, technology, diano, jaj. Empty = Nairobi clock."
        required: false
        default: ""
      force_all:
        description: "Run every desk once"
        required: false
        default: "false"

concurrency:
  group: writer-dispatcher
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  TZ: Africa/Nairobi
  DEFAULT_BRANCH: main
  LEDGER: .github/dispatcher_slots.txt

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      news: ${{ steps.p.outputs.news }}
      ghafla: ${{ steps.p.outputs.ghafla }}
      mpasho: ${{ steps.p.outputs.mpasho }}
      entertainment: ${{ steps.p.outputs.entertainment }}
      africa: ${{ steps.p.outputs.africa }}
      agriculture: ${{ steps.p.outputs.agriculture }}
      business: ${{ steps.p.outputs.business }}
      lifestyle: ${{ steps.p.outputs.lifestyle }}
      opinions: ${{ steps.p.outputs.opinions }}
      sports: ${{ steps.p.outputs.sports }}
      technology: ${{ steps.p.outputs.technology }}
      diano: ${{ steps.p.outputs.diano }}
      jaj: ${{ steps.p.outputs.jaj }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - name: Checkout ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Decide desks (Africa/Nairobi)
        id: p
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_desk || '' }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all || 'false' }}
        run: |
          set -euo pipefail
          EAT_H=$(TZ=Africa/Nairobi date +%H)
          EAT_M=$(TZ=Africa/Nairobi date +%M)
          EAT_DOW=$(TZ=Africa/Nairobi date +%u)
          EAT_DAY=$(TZ=Africa/Nairobi date +%F)
          EAT_NOW=$(TZ=Africa/Nairobi date '+%Y-%m-%d %H:%M %Z')
          echo "Now EAT: $EAT_NOW (dow=$EAT_DOW event=${GITHUB_EVENT_NAME})"

          H=$((10#$EAT_H))
          M=$((10#$EAT_M))
          NOW_MIN=$((H * 60 + M))
          LOOKBACK=180

          mkdir -p "$(dirname "$LEDGER")"
          [ -f "$LEDGER" ] || touch "$LEDGER"
          if [ -s "$LEDGER" ]; then
            sed -i \
              -e 's/:za-news.yml$/:news/' \
              -e 's/:za-ghafla.yml$/:ghafla/' \
              -e 's/:za-mpasho.yml$/:mpasho/' \
              -e 's/:za-entertainment.yml$/:entertainment/' \
              -e 's/:za Entertainment.yml$/:entertainment/' \
              -e 's/:za-africa.yml$/:africa/' \
              -e 's/:za africa.yml$/:africa/' \
              -e 's/:za-agriculture.yml$/:agriculture/' \
              -e 's/:za agriculture.yml$/:agriculture/' \
              -e 's/:za-business.yml$/:business/' \
              -e 's/:za business.yml$/:business/' \
              -e 's/:za-lifestyle.yml$/:lifestyle/' \
              -e 's/:za lifestyle.yml$/:lifestyle/' \
              -e 's/:za-opinions.yml$/:opinions/' \
              -e 's/:za opinions.yml$/:opinions/' \
              -e 's/:za-sports.yml$/:sports/' \
              -e 's/:za sports.yml$/:sports/' \
              -e 's/:za-technology.yml$/:technology/' \
              -e 's/:za technology.yml$/:technology/' \
              -e 's/:za-diano.yml$/:diano/' \
              -e 's/:za diano.yml$/:diano/' \
              -e 's/:za-jaj.yml$/:jaj/' \
              -e 's/:za jaj.yml$/:jaj/' \
              "$LEDGER"
          fi

          due() {
            local t=$((10#$1 * 60 + 10#$2))
            local d=$((NOW_MIN - t))
            if [ "$d" -lt 0 ]; then d=$((d + 1440)); fi
            [ "$d" -ge 0 ] && [ "$d" -le "$LOOKBACK" ]
          }

          slot_id() { printf '%sT%02d:%02d:%s\n' "$EAT_DAY" "$1" "$2" "$3"; }
          already() { grep -qxF "$1" "$LEDGER" 2>/dev/null; }

          DESKS="news ghafla mpasho entertainment africa agriculture business lifestyle opinions sports technology diano jaj"
          for d in $DESKS; do echo "$d=0" >> "$GITHUB_OUTPUT"; done
          : > /tmp/new_slots.txt
          COUNT=0

          fire() {
            local desk=$1 th=$2 tm=$3
            local sid
            sid=$(slot_id "$th" "$tm" "$desk")
            if already "$sid"; then
              echo "Already fired $sid"
              return
            fi
            echo "$desk=1" >> "$GITHUB_OUTPUT"
            echo "$sid" >> /tmp/new_slots.txt
            COUNT=$((COUNT + 1))
            echo "Due $desk at ${th}:$(printf '%02d' "$tm")"
          }

          fire_named() {
            echo "$1=1" >> "$GITHUB_OUTPUT"
            COUNT=$((COUNT + 1))
            echo "Force $1"
          }

          if [ "${FORCE_ALL:-false}" = "true" ]; then
            for d in $DESKS; do fire_named "$d"; done
          elif [ -n "${FORCE:-}" ] && [ "${FORCE}" != "null" ]; then
            desk=$(echo "$FORCE" | tr '[:upper:]' '[:lower:]' | sed 's/\.yml$//; s/^za-//; s/^za //')
            case "$desk" in
              news|ghafla|mpasho|entertainment|africa|agriculture|business|lifestyle|opinions|sports|technology|diano|jaj)
                fire_named "$desk" ;;
              *) echo "Unknown desk: $FORCE" >&2; exit 1 ;;
            esac
          else
            if [ "$H" -lt 6 ]; then
              echo "Before 06:00 EAT. Skipping."
            else
              if due "$H" 0; then fire news "$H" 0; fi
              for hm in "7:0" "11:0" "15:0" "19:0"; do
                IFS=: read -r th tm <<<"$hm"
                due "$th" "$tm" && fire ghafla "$th" "$tm"
              done
              for hm in "7:30" "11:30" "15:30" "19:30"; do
                IFS=: read -r th tm <<<"$hm"
                due "$th" "$tm" && fire mpasho "$th" "$tm"
              done
              for hm in "8:0" "12:0" "16:0" "20:0"; do
                IFS=: read -r th tm <<<"$hm"
                due "$th" "$tm" && fire entertainment "$th" "$tm"
              done
              due 6 15 && fire africa 6 15
              due 18 15 && fire africa 18 15
              due 7 15 && fire agriculture 7 15
              due 17 15 && fire agriculture 17 15
              due 8 15 && fire business 8 15
              due 16 15 && fire business 16 15
              due 9 15 && fire lifestyle 9 15
              due 15 15 && fire lifestyle 15 15
              due 10 15 && fire opinions 10 15
              due 14 15 && fire opinions 14 15
              due 11 15 && fire sports 11 15
              due 19 15 && fire sports 19 15
              due 12 15 && fire technology 12 15
              due 18 45 && fire technology 18 45
              due 13 15 && fire diano 13 15
              due 20 15 && fire diano 20 15
              if [ "$EAT_DOW" = "1" ] || [ "$EAT_DOW" = "4" ]; then
                due 11 20 && fire jaj 11 20
                due 17 20 && fire jaj 17 20
              fi
            fi
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          cp /tmp/new_slots.txt /tmp/slots_artifact.txt
          {
            echo "## Writer Dispatcher"
            echo "**EAT now:** $EAT_NOW"
            echo "**Event:** ${GITHUB_EVENT_NAME}"
            echo "**Desks due:** $COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload slots to record later
        uses: actions/upload-artifact@v4
        with:
          name: new-slots
          path: /tmp/slots_artifact.txt
          if-no-files-found: ignore

  news:
    needs: plan
    if: needs.plan.outputs.news == '1'
    uses: ./.github/workflows/za-news.yml
    secrets: inherit
  ghafla:
    needs: plan
    if: needs.plan.outputs.ghafla == '1'
    uses: ./.github/workflows/za-ghafla.yml
    secrets: inherit
  mpasho:
    needs: plan
    if: needs.plan.outputs.mpasho == '1'
    uses: ./.github/workflows/za-mpasho.yml
    secrets: inherit
  entertainment:
    needs: plan
    if: needs.plan.outputs.entertainment == '1'
    uses: ./.github/workflows/za-entertainment.yml
    secrets: inherit
  africa:
    needs: plan
    if: needs.plan.outputs.africa == '1'
    uses: ./.github/workflows/za-africa.yml
    secrets: inherit
  agriculture:
    needs: plan
    if: needs.plan.outputs.agriculture == '1'
    uses: ./.github/workflows/za-agriculture.yml
    secrets: inherit
  business:
    needs: plan
    if: needs.plan.outputs.business == '1'
    uses: ./.github/workflows/za-business.yml
    secrets: inherit
  lifestyle:
    needs: plan
    if: needs.plan.outputs.lifestyle == '1'
    uses: ./.github/workflows/za-lifestyle.yml
    secrets: inherit
  opinions:
    needs: plan
    if: needs.plan.outputs.opinions == '1'
    uses: ./.github/workflows/za-opinions.yml
    secrets: inherit
  sports:
    needs: plan
    if: needs.plan.outputs.sports == '1'
    uses: ./.github/workflows/za-sports.yml
    secrets: inherit
  technology:
    needs: plan
    if: needs.plan.outputs.technology == '1'
    uses: ./.github/workflows/za-technology.yml
    secrets: inherit
  diano:
    needs: plan
    if: needs.plan.outputs.diano == '1'
    uses: ./.github/workflows/za-diano.yml
    secrets: inherit
  jaj:
    needs: plan
    if: needs.plan.outputs.jaj == '1'
    uses: ./.github/workflows/za-jaj.yml
    secrets: inherit

  record:
    needs:
      - plan
      - news
      - ghafla
      - mpasho
      - entertainment
      - africa
      - agriculture
      - business
      - lifestyle
      - opinions
      - sports
      - technology
      - diano
      - jaj
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: new-slots
          path: /tmp/slots
      - name: Append fired slots safely
        run: |
          set -euo pipefail
          SLOTFILE=$(find /tmp/slots -type f | head -1 || true)
          [ -n "$SLOTFILE" ] && [ -s "$SLOTFILE" ] || { echo "No slots"; exit 0; }
          mkdir -p "$(dirname "$LEDGER")"
          [ -f "$LEDGER" ] || touch "$LEDGER"
          cat "$SLOTFILE" >> "$LEDGER"
          tail -n 400 "$LEDGER" > /tmp/ledger_trim.txt
          mv /tmp/ledger_trim.txt "$LEDGER"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER"
          git diff --staged --quiet && exit 0
          git commit -m "chore: record dispatcher slots"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            if git push origin HEAD:"$DEFAULT_BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

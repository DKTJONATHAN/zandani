name: Evening Brief

on:
  schedule:
    - cron: '0 18 * * *'  # 21:00 EAT
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt || pip install requests beautifulsoup4 google-genai
      - name: Run evening brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
        run: |
          if [ -f scripts/evening_brief.py ]; then
            python scripts/evening_brief.py
          else
            echo "No evening_brief.py — skip"
          fi

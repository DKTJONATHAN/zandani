name: Evening brief

# 19:07 East Africa Time (16:07 UTC). GitHub cron is always UTC — there is
# no timezone: key. Three Kenya-first stories to every active subscriber
# in data/subscribers.json.
#
# Secret to add: RESEND_API_KEY (free account at https://resend.com)
# Optional: RESEND_FROM  e.g. "Za Ndani <brief@zandani.co.ke>"
#   Until the zandani.co.ke domain is verified in Resend, use the default
#   onboarding@resend.dev (that address can only mail the Resend owner).

on:
  schedule:
    - cron: "7 16 * * *"
  workflow_dispatch:

concurrency:
  group: evening-brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Send the evening brief
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::error::Add GitHub secret RESEND_API_KEY from resend.com (free)."
            exit 1
          fi
          python scripts/email_brief.py digest

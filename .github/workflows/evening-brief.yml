name: Evening brief

# 19:07 EAT (16:07 UTC). Active emails from Supabase newsletter_subscribers.
#
# Secrets: RESEND_API_KEY, SUPABASE_URL, SUPABASE_SECRET_KEY
# Optional: RESEND_FROM

on:
  schedule:
    - cron: "7 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this manual run send?"
        required: true
        default: digest
        type: choice
        options:
          - digest
          - welcome-all

concurrency:
  group: evening-brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Send the evening brief
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::error::Add GitHub secret RESEND_API_KEY"
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_SECRET_KEY secrets"
            exit 1
          fi
          python scripts/email_brief.py digest

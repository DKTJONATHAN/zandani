name: AI Room — Gemini

on:
  push:
    branches: [main]
    paths:
      - "data/ai-chats/*.json"
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Optional chat id to process"
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Gemini conversation
        id: select
        env:
          CHAT_ID: ${{ inputs.chat_id || '' }}
        run: |
          python - <<'PY'
          import glob, json, os
          wanted = os.environ.get("CHAT_ID", "").strip()
          candidates = []
          for path in glob.glob("data/ai-chats/*.json"):
              try:
                  data = json.load(open(path, encoding="utf-8"))
              except Exception:
                  continue
              if wanted and data.get("id") != wanted:
                  continue
              if data.get("status") in {"awaiting_gemini", "awaiting_gemini_counter"}:
                  candidates.append((data.get("updated_at", data.get("created_at", "")), path))
          if not candidates:
              print("No Gemini turn is waiting.")
              open(os.environ["GITHUB_OUTPUT"], "a").write("found=false\n")
          else:
              path = sorted(candidates)[0][1]
              print(f"Processing {path}")
              open(os.environ["GITHUB_OUTPUT"], "a").write(f"found=true\npath={path}\n")
          PY

      - name: Run Gemini
        if: steps.select.outputs.found == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: python scripts/ai-room-agent.py gemini "${{ steps.select.outputs.path }}"

      - name: Commit Gemini response
        if: steps.select.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.select.outputs.path }}"
          git diff --cached --quiet || git commit -m "ai-room: Gemini response"
          git push origin main

      - name: Hand off to ChatGPT
        if: steps.select.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ai-room-chatgpt.yml --ref main --field chat_id="$(python -c 'import json; print(json.load(open("${{ steps.select.outputs.path }}"))["id"])')"

name: Wanjiku Kuria — Ghafla

on:
  schedule:
    - cron: '44 */2 * * *'
      timezone: 'Africa/Nairobi'
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: zandani-main-content-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_ghafla.json
  TZ: Africa/Nairobi
  WRITER_PROMPT_FILE: scripts/zandani_writer_prompt.txt
  FRESH_HOURS: "24"

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, ref: ${{ env.DEFAULT_BRANCH }}, token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}, persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai beautifulsoup4 lxml playwright python-dateutil Pillow
          playwright install chromium --with-deps
      - name: Enforce writer contract
        env: {WRITER_DESK: ghafla}
        run: |
          test -f scripts/zandani_writer_prompt.txt
          test -f scripts/article_intelligence.py
          test -f scripts/article_revamp.py
          python scripts/enforce_writer_contract.py
      - name: Run Ghafla pipeline
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          WRITER_PROMPT_FILE: ${{ env.WRITER_PROMPT_FILE }}
          FRESH_HOURS: "24"
        run: python scripts/ghafla_desk.py
      - name: Editorial image + angle revamp
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          REVAMP_CATEGORY: Gossip
          REVAMP_AUTHOR: Wanjiku Kuria
          FRESH_HOURS: "24"
        run: python scripts/article_revamp.py
      - name: Finish desk
        run: if [ -f scripts/finish_desk.py ]; then python scripts/finish_desk.py || true; fi
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Za Ndani"; git config user.email "bot@zandani.co.ke"
          git add -A; if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: ghafla desk (angle-gap <=24h)"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${DEFAULT_BRANCH}"; git rebase "origin/${DEFAULT_BRANCH}"
            if git push origin HEAD:"${DEFAULT_BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

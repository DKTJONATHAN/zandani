name: Wanjiku Kuria — Ghafla

# 5 runs/day East Africa Time (UTC+3). GitHub cron is UTC — no timezone key.
# Slots: 08:23, 11:23, 14:23, 17:23, 20:23 EAT.
on:
  schedule:
    - cron: "23 5 * * *"   # 08:23 EAT
    - cron: "23 8 * * *"   # 11:23 EAT
    - cron: "23 11 * * *"  # 14:23 EAT
    - cron: "23 14 * * *"  # 17:23 EAT
    - cron: "23 17 * * *"  # 20:23 EAT
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: zandani-desk-za-ghafla
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_wanjiku.json
  TZ: Africa/Nairobi
  WRITER_PROMPT_FILE: scripts/zandani_writer_prompt.txt
  WRITER_MAX_AGE_HOURS: "24"
  FRESH_HOURS: "24"
  WRITE_EVERY_ELIGIBLE_STORY: "1"

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-ghafla-v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai beautifulsoup4 lxml playwright python-dateutil Pillow
          playwright install chromium --with-deps

      - name: Enforce 24h freshness and angle-gap writer (ghafla)
        env:
          WRITER_DESK: ghafla
        run: |
          set -e
          echo "Desk ghafla: angle-gap JSON writer, 24h source max-age"
          echo "Every eligible story is written. Skip only if older than 24h or unusable."
          test -f scripts/zandani_writer_prompt.txt
          python scripts/enforce_writer_contract.py

      - name: Run Wanjiku Ghafla pipeline (≤24h, independent stories)
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          WRITER_PROMPT_FILE: ${{ env.WRITER_PROMPT_FILE }}
          WRITER_MAX_AGE_HOURS: "24"
          FRESH_HOURS: "24"
          WRITE_EVERY_ELIGIBLE_STORY: "1"
          TZ: Africa/Nairobi
        run: |
          set -e
          if [ -f scripts/wanjiku_ghafla.py ]; then
            python scripts/wanjiku_ghafla.py
          else
            echo "scripts/wanjiku_ghafla.py missing"
            exit 1
          fi

      - name: Voice, SEO and Kenya-first gate
        run: |
          if [ -f scripts/finish_desk.py ]; then
            python scripts/finish_desk.py || true
          else
            echo "finish_desk.py not present — skip"
          fi

      - name: Commit history and new posts
        run: |
          git config user.name  "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add -A "${MEMORY_FILE}" content/posts || true
          if git diff --cached --quiet; then
            echo "No article or memory changes to commit"
            exit 0
          fi
          git commit -m "content: Wanjiku Kuria ghafla (angle-gap ≤24h)"
          git pull --rebase origin "${DEFAULT_BRANCH}" || git pull origin "${DEFAULT_BRANCH}" --no-rebase || true
          git push origin HEAD:"${DEFAULT_BRANCH}"

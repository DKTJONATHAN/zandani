name: Desk Rotator

# Manual emergency/rotation tool only. Automatic publishing is owned by the
# individual desk schedules and the scheduled-post publisher. Keeping this
# workflow manual prevents duplicate desk runs and competing writes to main.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly = news/ghafla/mpasho only | rotate = one desk | both = both"
        required: false
        default: "both"
      force_desk:
        description: "Optional: force one rotation desk"
        required: false
        default: ""

# The rotator writes the same branch as every content writer. It must share
# their lock so its ledger commit cannot race a writer's commit/push.
concurrency:
  group: zandani-main-content-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  TZ: Africa/Nairobi
  DEFAULT_BRANCH: main
  ROTATION_LEDGER: .github/desk_rotation_ledger.txt

jobs:
  rotate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Decide and fire workflows
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'both' }}
          FORCE_DESK: ${{ inputs.force_desk || '' }}
        run: |
          set -euo pipefail
          export TZ=Africa/Nairobi
          EAT_NOW=$(date '+%Y-%m-%d %H:%M %Z')
          POOL=(entertainment africa agriculture business lifestyle opinions sports technology diano jaj)
          desk_to_workflow() {
            case "$1" in
              news) echo "za-news.yml";; ghafla) echo "za-ghafla.yml";; mpasho) echo "za-mpasho.yml";;
              entertainment) echo "za-entertainment.yml";; africa) echo "za-africa.yml";; agriculture) echo "za-agriculture.yml";;
              business) echo "za-business.yml";; lifestyle) echo "za-lifestyle.yml";; opinions) echo "za-opinions.yml";;
              sports) echo "za-sports.yml";; technology) echo "za-technology.yml";; diano) echo "za-diano.yml";; jaj) echo "za-jaj.yml";; *) return 1;;
            esac
          }
          fire() { local wf; wf=$(desk_to_workflow "$1"); echo "Triggering $wf ($1) at $EAT_NOW"; gh workflow run "$wf" --ref "$DEFAULT_BRANCH"; }

          mkdir -p "$(dirname "$ROTATION_LEDGER")"; touch "$ROTATION_LEDGER"
          if [ "$MODE" = "hourly" ] || [ "$MODE" = "both" ]; then
            fire news; fire ghafla; fire mpasho
          fi
          if [ "$MODE" = "rotate" ] || [ "$MODE" = "both" ]; then
            REMAINING=()
            for desk in "${POOL[@]}"; do grep -qxF "$desk" "$ROTATION_LEDGER" || REMAINING+=("$desk"); done
            if [ "${#REMAINING[@]}" -eq 0 ]; then : > "$ROTATION_LEDGER"; REMAINING=("${POOL[@]}"); fi
            if [ -n "$FORCE_DESK" ]; then PICK=$(echo "$FORCE_DESK" | tr '[:upper:]' '[:lower:]' | sed 's/\.yml$//; s/^za-//'); else PICK="${REMAINING[$((RANDOM % ${#REMAINING[@]}))]}"; fi
            printf '%s\n' "${POOL[@]}" | grep -qxF "$PICK" || { echo "Invalid rotation desk: $PICK" >&2; exit 1; }
            fire "$PICK"
            grep -qxF "$PICK" "$ROTATION_LEDGER" || echo "$PICK" >> "$ROTATION_LEDGER"
            git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$ROTATION_LEDGER"
            if ! git diff --staged --quiet; then
              git commit -m "chore: record manual desk rotation"
              for attempt in 1 2 3 4 5; do
                git fetch origin "$DEFAULT_BRANCH"
                git rebase "origin/$DEFAULT_BRANCH"
                if git push origin HEAD:"$DEFAULT_BRANCH"; then exit 0; fi
                sleep $((attempt * 2))
              done
              exit 1
            fi
          fi

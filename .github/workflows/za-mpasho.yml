name: Martin Kihara — Mpasho / Showbiz

on:
  schedule:
    - cron: '20 */2 * * *'
      timezone: 'Africa/Nairobi'
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: zandani-desk-za-mpasho
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_mpasho.json
  TZ: Africa/Nairobi
  WRITER_PROMPT_FILE: scripts/zandani_writer_prompt.txt
  WRITER_MAX_AGE_HOURS: "24"
  FRESH_HOURS: "24"
  WRITE_EVERY_ELIGIBLE_STORY: "1"

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai beautifulsoup4 lxml playwright python-dateutil Pillow
          playwright install chromium --with-deps

      - name: Enforce writer contract
        env:
          WRITER_DESK: mpasho
        run: |
          set -e
          test -f scripts/zandani_writer_prompt.txt
          python scripts/enforce_writer_contract.py

      - name: Run Mpasho pipeline
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          WRITER_PROMPT_FILE: ${{ env.WRITER_PROMPT_FILE }}
          WRITER_MAX_AGE_HOURS: "24"
          FRESH_HOURS: "24"
          WRITE_EVERY_ELIGIBLE_STORY: "1"
          TZ: Africa/Nairobi
        run: |
          set -e
          python scripts/martin_mpasho.py

      - name: Rehost images on ImgBB (front matter + body)
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
        run: |
          python << 'EOF'
          import os, re, io, base64, glob, time
          import requests
          try:
              from PIL import Image
          except Exception:
              Image = None
          API = os.environ.get("IMGBB_API_KEY") or ""
          POSTS = os.environ.get("POSTS_DIR") or "content/posts"
          if not API:
              print("IMGBB_API_KEY missing — skip rehost")
              raise SystemExit(0)
          cache = {}
          def upload(url):
              if not url or not url.startswith("http"):
                  return url
              if "ibb.co" in url or "imgbb.com" in url:
                  return url
              if url in cache:
                  return cache[url]
              try:
                  r = requests.get(url, timeout=25, headers={"User-Agent": "ZaNdani/1.0"})
                  r.raise_for_status()
                  raw = r.content
                  if len(raw) < 400:
                      return url
                  b64 = None
                  if Image is not None:
                      try:
                          img = Image.open(io.BytesIO(raw))
                          if img.mode in ("RGBA", "LA", "P"):
                              img = img.convert("RGB")
                          if img.width > 1400:
                              ratio = 1400 / float(img.width)
                              img = img.resize((1400, max(1, int(img.height * ratio))), Image.LANCZOS)
                          buf = io.BytesIO()
                          img.save(buf, format="WEBP", quality=82, method=4)
                          b64 = base64.b64encode(buf.getvalue()).decode()
                      except Exception as e:
                          print("webp fail", e)
                  if not b64:
                      b64 = base64.b64encode(raw).decode()
                  res = requests.post("https://api.imgbb.com/1/upload", data={"key": API, "image": b64}, timeout=30)
                  if res.status_code == 200:
                      data = res.json().get("data") or {}
                      new = data.get("url") or data.get("display_url") or ""
                      if new:
                          print("hosted", url[:80], "->", new)
                          cache[url] = new
                          return new
                  print("imgbb fail", res.status_code, res.text[:160])
              except Exception as e:
                  print("rehost error", e)
              cache[url] = url
              return url
          files = sorted(glob.glob(os.path.join(POSTS, "*.md")), key=os.path.getmtime, reverse=True)[:12]
          for path in files:
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              orig = text
              m = re.search(r'(?m)^image:\s*"([^"]*)"', text)
              if m and m.group(1):
                  hosted = upload(m.group(1))
                  text = text[:m.start(1)] + hosted + text[m.end(1):]
              def repl(mm):
                  return mm.group(1) + upload(mm.group(2)) + mm.group(3)
              text = re.sub(r'(!\[[^\]]*\]\()(https?://[^)\s]+)(\))', repl, text)
              text = re.sub(r'(<img[^>]+src=["\'])(https?://[^"\']+)(["\'])', repl, text)
              if text != orig:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)
                  print("updated", path)
              time.sleep(0.2)
          print("ImgBB rehost done")
          EOF

      - name: Commit
        run: |
          git config user.name  "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add -A "${MEMORY_FILE}" content/posts || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: mpasho desk (angle-gap <=24h)"
          git pull --rebase origin "${DEFAULT_BRANCH}" || true
          git push origin HEAD:"${DEFAULT_BRANCH}"

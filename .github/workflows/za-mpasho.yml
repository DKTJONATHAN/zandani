name: Martin Kihara — Mpasho / Showbiz

on:
  schedule:
    - cron: '15 */2 * * *'
      timezone: 'Africa/Nairobi'
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: zandani-main-content-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_martin_mpasho.json
  TZ: Africa/Nairobi
  FRESH_HOURS: "24"
  WRITER_PROMPT_FILE: scripts/zandani_writer_prompt.txt
  DESK_AUTHOR: "Martin Kihara"
  DESK_CATEGORY: "Showbiz"
  DESK_SOURCE: "https://www.mpasho.co.ke/entertainment"
  DESK_DOMAIN: "mpasho.co.ke"
  DESK_ROLE: "showbiz correspondent"
  DESK_AUDIENCE: "Kenyan entertainment and showbiz readers"

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-mpasho-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai beautifulsoup4 lxml python-dateutil playwright Pillow
          playwright install chromium --with-deps
      - name: Enforce 24h freshness and GAP writer contract
        env:
          WRITER_DESK: ghafla
        run: |
          set -e
          test -f scripts/zandani_writer_prompt.txt
          test -f scripts/article_intelligence.py
          test -f scripts/desk_writer.py
          test -f scripts/desk_image_pipeline.py
          test -f scripts/martin_mpasho.py
          python scripts/enforce_writer_contract.py
          python -m py_compile scripts/martin_mpasho.py scripts/desk_writer.py scripts/desk_image_pipeline.py
      - name: Run Wanjiku Ghafla pipeline (24h GAP + source images)
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          FRESH_HOURS: ${{ env.FRESH_HOURS }}
          TZ: ${{ env.TZ }}
        run: python scripts/martin_mpasho.py
      - name: Voice / SEO gate (optional — never block publish)
        run: |
          if [ -f scripts/finish_desk.py ]; then python scripts/finish_desk.py || true; fi
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: Martin Kihara Mpasho (GAP + source images)"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${DEFAULT_BRANCH}"
            git rebase "origin/${DEFAULT_BRANCH}"
            if git push origin HEAD:"${DEFAULT_BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

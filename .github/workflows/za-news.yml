name: Celestine Nzioka — News

on:
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: zandani-main-content-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  TZ: Africa/Nairobi

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Generate through private Supabase newsroom engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_SECRET_KEY}"
          curl --fail-with-body --retry 2 --retry-delay 3 \
            -X POST "${SUPABASE_URL}/functions/v1/newsroom-writer" \
            -H "Content-Type: application/json" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            --data '{"desk":"news","author":"Celestine Nzioka","source_list":"https://www.kenyans.co.ke/news"}' \
            -o /tmp/newsroom.json

          python - <<'PY'
          import json, os, pathlib, re, sys
          data = json.load(open("/tmp/newsroom.json", encoding="utf-8"))
          if data.get("error"):
              raise SystemExit("newsroom engine error: " + str(data["error"]))
          result = data.get("result") or {}
          if result.get("status") != "write":
              print("NO-PUBLISH:", result.get("skip_reason") or "editorial skip")
              pathlib.Path("/tmp/NO_PUBLISH").write_text("1", encoding="utf-8")
              raise SystemExit(0)

          article = result.get("article") or {}
          title = (article.get("title") or "").strip()
          body = (article.get("body_markdown") or "").strip()
          description = (article.get("description") or "").strip()
          source = data.get("source") or {}
          source_url = source.get("url") or source.get("source_url") or ""
          source_url = data.get("source_url") or ""
          og = data.get("og_image") or ""
          if not title or len(body.split()) < 220:
              raise SystemExit("publication quality gate failed")

          slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")[:80]
          if not slug:
              raise SystemExit("could not create slug")
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          today = now.strftime("%Y-%m-%d")
          path = pathlib.Path("content/posts") / f"{today}-{slug}.md"

          def q(v):
              return json.dumps(str(v or ""), ensure_ascii=False)

          front = [
              "---",
              f"title: {q(title)}",
              f"slug: {q(slug)}",
              f"description: {q(description)}",
              f"excerpt: {q(description)}",
              f"date: {q(now.isoformat())}",
              f"dateModified: {q(now.isoformat())}",
              'author: "Celestine Nzioka"',
              'category: "News"',
              f"image: {q(og)}",
              f"source: {q(source_url)}",
              'schema: "NewsArticle"',
              "---",
              "",
              body,
              ""
          ]
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text("\n".join(front), encoding="utf-8")
          print("PUBLISHED FILE:", path)
          print("MODEL VERSION:", data.get("model_version"))
          print("GAP VERSION:", data.get("gap_version"))
          print("IMAGE PIPELINE VERSION:", data.get("image_pipeline_version"))
          PY

      - name: Commit and push article
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/NO_PUBLISH ]; then exit 0; fi
          git config user.name "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add content/posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: Celestine Nzioka news (server-side GAP)"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${DEFAULT_BRANCH}"
            git rebase "origin/${DEFAULT_BRANCH}"
            if git push origin HEAD:"${DEFAULT_BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

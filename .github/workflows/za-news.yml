name: Celestine Nzioka — News

on:
  schedule:
    # Hourly in Kenyan time (EAT = UTC+3 / Africa/Nairobi)
    # Minute 11 avoids :00 queue pile-up with other desks
    # 06:11–23:11 EAT → UTC 03:11–20:11
    - cron: "11 3-20 * * *"
  workflow_dispatch: {}

concurrency:
  group: zandani-desk-za-news
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_celestine_news.json
  TZ: Africa/Nairobi

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-news-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai beautifulsoup4 lxml playwright python-dateutil Pillow
          playwright install chromium --with-deps

      - name: Run Celestine News pipeline (≤24h)
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          TZ: Africa/Nairobi
        run: |
          set -e
          echo "=== Celestine News scraper (Kenya / EAT) ==="
          date
          echo "Source: https://www.kenyans.co.ke/news"
          echo "Freshness gate: 24 hours"
          if [ ! -f scripts/celestine_news.py ]; then
            echo "ERROR: scripts/celestine_news.py missing"
            exit 1
          fi
          # Safety: force FRESH_HOURS=24
          python - << 'CHK'
          from pathlib import Path
          import re
          p = Path("scripts/celestine_news.py")
          t = p.read_text()
          if "FRESH_HOURS = 24" not in t:
              t2 = re.sub(r"FRESH_HOURS\s*=\s*\d+", "FRESH_HOURS = 24", t)
              if "FRESH_HOURS = 24" not in t2:
                  t2 = t.replace("MAX_SCRAPE_TRIES = 8", "MAX_SCRAPE_TRIES = 8\nFRESH_HOURS = 24")
              p.write_text(t2)
              print("Patched FRESH_HOURS = 24 into scripts/celestine_news.py")
          else:
              print("FRESH_HOURS = 24 already set")
          CHK
          python scripts/celestine_news.py

      - name: Voice / SEO gate (optional — never block publish)
        run: |
          if [ -f scripts/finish_desk.py ]; then
            python scripts/finish_desk.py || true
          else
            echo "finish_desk.py not present — skip"
          fi

      - name: Commit and push
        run: |
          git config user.name  "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add -A "${MEMORY_FILE}" content/posts || true
          if git diff --cached --quiet; then
            echo "No article or memory changes to commit"
            exit 0
          fi
          git commit -m "content: Celestine Nzioka news (≤24h)"
          git pull --rebase origin "${DEFAULT_BRANCH}" || git pull origin "${DEFAULT_BRANCH}" --no-rebase || true
          git push origin HEAD:"${DEFAULT_BRANCH}"

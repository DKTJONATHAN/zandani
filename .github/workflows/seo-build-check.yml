name: SEO Build Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client, SEO assets and SSR bundle
        run: npm run build
      - name: Validate generated sitemap index and robots directives
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/sitemap.xml
          test -s dist/sitemap-static.xml
          test -s dist/sitemap-articles.xml
          test -s dist/robots.txt
          grep -q '<sitemapindex' dist/sitemap.xml
          grep -q 'Sitemap: https://zandani.co.ke/sitemap.xml' dist/robots.txt
          grep -q 'Allow: /' dist/robots.txt
          echo "Generated SEO assets are present and robots.txt allows crawling."

name: Amara Ndlovu — East Africa

on:
  schedule:
    - cron: '12 * * * *'
      timezone: 'Africa/Nairobi'
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: zandani-main-content-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_amara.json
  TZ: Africa/Nairobi
  WRITER_PROMPT_FILE: scripts/zandani_writer_prompt.txt
  WRITER_MAX_AGE_HOURS: "24"
  FRESH_HOURS: "24"
  WRITE_EVERY_ELIGIBLE_STORY: "1"

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai beautifulsoup4 lxml playwright python-dateutil Pillow
          playwright install chromium --with-deps
      - name: Enforce writer contract
        env: {WRITER_DESK: africa}
        run: |
          set -e
          test -f scripts/zandani_writer_prompt.txt
          test -f scripts/article_intelligence.py
          test -f scripts/article_revamp.py
          python scripts/enforce_writer_contract.py
      - name: Run East Africa pipeline
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          WRITER_PROMPT_FILE: ${{ env.WRITER_PROMPT_FILE }}
          WRITER_MAX_AGE_HOURS: "24"
          FRESH_HOURS: "24"
          WRITE_EVERY_ELIGIBLE_STORY: "1"
          TZ: Africa/Nairobi
        run: python scripts/amara_africa.py
      - name: Normalize shared revamp guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/article_revamp.py')
          s = p.read_text(encoding='utf-8')
          old = 'mentions_stale_year(body, __import__("datetime").datetime.utcnow().year + 3)'
          new = 'mentions_stale_year(body, __import__("datetime").datetime.utcnow().year)'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Normalized revamp year gate')
          else:
              print('Revamp year gate already normalized')
          PY
      - name: Editorial image + angle revamp
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          REVAMP_CATEGORY: Africa
          REVAMP_AUTHOR: Amara Ndlovu
          FRESH_HOURS: "24"
        run: python scripts/article_revamp.py
      - name: Finish desk
        run: if [ -f scripts/finish_desk.py ]; then python scripts/finish_desk.py || true; fi
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: Amara Ndlovu africa (angle-gap <=24h)"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${DEFAULT_BRANCH}"
            git rebase "origin/${DEFAULT_BRANCH}"
            if git push origin HEAD:"${DEFAULT_BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

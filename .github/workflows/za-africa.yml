name: Amara Ndlovu — East Africa

# August-style: this desk owns its own schedule. No universal dispatcher cron.
on:
  schedule:
    - cron: "35 3-20 * * *"
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: zandani-desk-za-africa
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_amara.json
  TZ: Africa/Nairobi

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai beautifulsoup4 lxml playwright python-dateutil
          playwright install chromium --with-deps

      - name: Run Amara East Africa pipeline
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
        run: |
          if [ -f scripts/amara_africa.py ]; then
            python scripts/amara_africa.py
          elif [ -f scripts/writer_core.py ]; then
            python -c "from writer_core import run_writer; run_writer({'author_name':'Amara Ndlovu','category':'Africa','source_url':'https://www.africanews.com/','source_domain':'africanews.com','memory_file':'.github/memory_amara.json'})"
          else
            echo "No Africa desk script"
            exit 0
          fi

      - name: Voice, SEO and Kenya-first gate
        run: python scripts/finish_desk.py || true

      - name: Commit history and new posts
        run: |
          git config user.name  "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add -A "${MEMORY_FILE}" content/posts || true
          if git diff --cached --quiet; then
            echo "No article or memory changes to commit"
            exit 0
          fi
          git commit -m "content: Amara Ndlovu africa"
          git pull --rebase origin "${DEFAULT_BRANCH}" || git pull origin "${DEFAULT_BRANCH}" --no-rebase || true
          git push origin HEAD:"${DEFAULT_BRANCH}"

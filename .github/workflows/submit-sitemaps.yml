name: Verify public sitemaps

on:
  push:
    paths:
      - "content/posts/**.md"
      - "scripts/generate-seo.js"
      - "scripts/inject-meta.js"
      - "public/sitemap.xml"
      - "public/news-sitemap.xml"
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: verify-public-sitemaps
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Wait for Cloudflare deployment
        if: github.event_name == 'push'
        run: sleep 60

      - name: Verify live sitemap index
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/sitemap.xml -w "%{http_code}" https://zandani.co.ke/sitemap.xml)
            if [ "$code" = "200" ]; then break; fi
            echo "sitemap.xml returned $code; retry $attempt/5"
            sleep 30
          done
          test "$code" = "200"
          grep -q 'sitemap-articles.xml' /tmp/sitemap.xml
          grep -q 'news-sitemap.xml' /tmp/sitemap.xml

      - name: Verify live news sitemap
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/news-sitemap.xml -w "%{http_code}" https://zandani.co.ke/news-sitemap.xml)
          test "$code" = "200"
          grep -q 'schemas/sitemap-news/0.9' /tmp/news-sitemap.xml

      - name: Confirm sitemap is discoverable
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/robots.txt -w "%{http_code}" https://zandani.co.ke/robots.txt)
          test "$code" = "200"
          grep -q 'Sitemap: https://zandani.co.ke/sitemap.xml' /tmp/robots.txt
          echo "Public sitemap index, news sitemap and robots discovery checks passed."

name: Verify and submit sitemaps

on:
  push:
    paths:
      - "content/posts/**.md"
      - "scripts/generate-seo.js"
      - "scripts/inject-meta.js"
      - "public/sitemap.xml"
      - "public/news-sitemap.xml"
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: submit-sitemaps
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Wait for Cloudflare deployment
        if: github.event_name == 'push'
        run: sleep 60

      - name: Verify live sitemap index
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/sitemap.xml -w "%{http_code}" https://zandani.co.ke/sitemap.xml)
            if [ "$code" = "200" ]; then break; fi
            echo "sitemap.xml returned $code; retry $attempt/5"
            sleep 30
          done
          test "$code" = "200"
          grep -q 'sitemap-articles.xml' /tmp/sitemap.xml
          grep -q 'news-sitemap.xml' /tmp/sitemap.xml

      - name: Verify live news sitemap
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/news-sitemap.xml -w "%{http_code}" https://zandani.co.ke/news-sitemap.xml)
          test "$code" = "200"
          grep -q 'news.google.com' /tmp/news-sitemap.xml || grep -q 'schemas/sitemap-news/0.9' /tmp/news-sitemap.xml

      - name: Submit sitemap index to Google Search Console
        env:
          GSC_KEY_RAW: ${{ secrets.GSC_JSON_KEY }}
        run: |
          if [ -z "${GSC_KEY_RAW:-}" ]; then
            echo "GSC_JSON_KEY is not configured; sitemap remains discoverable via robots.txt."
            exit 0
          fi
          npm install googleapis --no-save
          node <<'NODE'
          const { google } = require('googleapis');
          const keys = JSON.parse(process.env.GSC_KEY_RAW);
          keys.private_key = keys.private_key.replace(/\\n/g, '\n');
          const auth = new google.auth.GoogleAuth({ credentials: keys, scopes: ['https://www.googleapis.com/auth/webmasters'] });
          const searchconsole = google.searchconsole({ version: 'v1', auth });
          searchconsole.sitemaps.submit({ siteUrl: 'https://zandani.co.ke/', feedpath: 'https://zandani.co.ke/sitemap.xml' })
            .then(() => console.log('Google Search Console sitemap submitted.'))
            .catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

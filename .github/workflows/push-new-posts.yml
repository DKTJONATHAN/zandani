name: Push New Posts / generate-and-publish

on:
  push:
    paths:
      - 'content/posts/**'
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install and build
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build || true
          fi
      - name: Deploy note
        run: echo "Posts updated — deploy via Cloudflare/hosting hook if configured"

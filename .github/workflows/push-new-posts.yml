name: Push — new posts

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
  workflow_dispatch:

concurrency:
  group: push-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install web-push
        run: npm install --no-save web-push@3

      - name: Send notifications for new posts
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/send_push_notifications.js

      - name: Commit pruned dead subscriptions (if any)
        run: |
          if git diff --quiet data/push_subscriptions.json; then
            echo "no subscription changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/push_subscriptions.json
          git commit -m "chore(push): prune expired subscriptions" || true
          git push || true

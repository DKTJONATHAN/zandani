name: SEO Audit

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run SEO audit
        run: |
          if [ -f scripts/seo_audit.py ]; then
            python scripts/seo_audit.py
          else
            echo "No seo_audit.py — basic frontmatter check"
            python - <<'PY'
import pathlib
for p in pathlib.Path('content/posts').glob('*.md'):
    t = p.read_text(encoding='utf-8', errors='replace')
    if not t.startswith('---'):
        print('no fm', p)
print('done')
PY
          fi

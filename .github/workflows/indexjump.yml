name: IndexJump SEO

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexjump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Ping IndexJump / sitemap
        env:
          INDEXJUMP_API_KEY: ${{ secrets.INDEXJUMP_API_KEY }}
        run: |
          if [ -z "${INDEXJUMP_API_KEY:-}" ]; then
            echo "No INDEXJUMP_API_KEY — skip"
            exit 0
          fi
          if [ -f scripts/indexjump.py ]; then
            python scripts/indexjump.py || true
          else
            curl -sS -X POST "https://api.indexjump.com/v1/submit" \
              -H "Authorization: Bearer ${INDEXJUMP_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"url":"https://zandani.co.ke/sitemap.xml"}' || true
          fi

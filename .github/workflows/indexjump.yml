name: IndexJump SEO

on:
  push:
    branches: [main]
    paths:
      - "content/posts/*.md"
      - "scripts/generate-seo.js"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexjump-seo
  cancel-in-progress: false

jobs:
  indexjump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Capture article URLs from repository
        id: urls
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          SITE = "https://zandani.co.ke"
          output = Path(os.environ["GITHUB_OUTPUT"])

          def article_url(filename):
              text = Path(filename).read_text(encoding="utf-8")
              match = re.search(r"^slug:\s*(?:[\"']([^\"']+)[\"']|([^\s#]+))", text, re.MULTILINE)
              slug = (match.group(1) or match.group(2)).strip() if match else Path(filename).stem
              if not re.fullmatch(r"[a-z0-9-]+", slug):
                  raise SystemExit(f"Invalid article slug in {filename}: {slug}")
              return f"{SITE}/article/{slug}"

          def tracked_posts():
              result = subprocess.check_output(
                  ["git", "ls-files", "--", "content/posts/*.md"], text=True
              )
              return [p for p in result.splitlines() if p.endswith(".md") and Path(p).is_file()]

          event = os.environ.get("EVENT_NAME", "")
          files = []

          if event == "push":
              before = os.environ.get("BEFORE_SHA", "")
              after = os.environ.get("AFTER_SHA", "")
              if before and set(before) != {"0"}:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", before, after, "--", "content/posts/*.md"],
                      text=True
                  ).splitlines()
                  files = [p for p in changed if p.endswith(".md") and Path(p).is_file()]
              else:
                  # First push/branch creation: use the newest repository articles.
                  files = tracked_posts()
          else:
              # Scheduled/manual runs use Git history, not the live sitemap (Cloudflare
              # can return HTTP 403 to GitHub-hosted runners).
              files = tracked_posts()

          if event != "push" or not files:
              def last_changed(filename):
                  try:
                      return int(subprocess.check_output(
                          ["git", "log", "-1", "--format=%ct", "--", filename],
                          text=True, stderr=subprocess.DEVNULL
                      ).strip() or "0")
                  except (subprocess.CalledProcessError, ValueError):
                      return 0
              files.sort(key=last_changed, reverse=True)
              files = files[:20]

          urls = list(dict.fromkeys(article_url(p) for p in files))
          if not urls:
              print("No changed or eligible article URLs found; nothing to submit.")
              with output.open("a", encoding="utf-8") as out:
                  out.write("has_urls=false\n")
              raise SystemExit(0)

          # IndexJump bulk API accepts batches; keep within a conservative batch size.
          urls = urls[:50]
          Path("indexjump-urls.json").write_text(
              json.dumps({"urls": urls}, ensure_ascii=False), encoding="utf-8"
          )
          with output.open("a", encoding="utf-8") as out:
              out.write("has_urls=true\n")
              out.write(f"count={len(urls)}\n")
          print("Captured article URL(s) directly from committed Markdown:")
          for url in urls:
              print(f"  {url}")
          PY

      - name: Submit captured URLs to IndexJump
        if: steps.urls.outputs.has_urls == 'true'
        env:
          INDEXJUMP_API_KEY: ${{ secrets.INDEXJUMP_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${INDEXJUMP_API_KEY:-}" ]; then
            echo "::error::Repository secret INDEXJUMP_API_KEY is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "https://api.indexjump.com/index/bulk?token=${INDEXJUMP_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @indexjump-urls.json)"

          echo "IndexJump HTTP status: $status"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::IndexJump returned HTTP $status."
            echo "Response body omitted to avoid exposing sensitive API details."
            exit 1
          fi

          python - "$response_file" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  data = json.load(handle)
          except Exception as exc:
              raise SystemExit(f"IndexJump returned invalid JSON: {exc}")

          if data.get("err") is not None:
              raise SystemExit(f"IndexJump rejected the request: {data.get('err')}")
          result = data.get("res")
          if not isinstance(result, dict) or result.get("success") is not True:
              raise SystemExit("IndexJump response did not confirm successful submission.")
          accepted = result.get("urls")
          if isinstance(accepted, list):
              print(f"IndexJump confirmed success for {len(accepted)} URL(s).")
          else:
              print("IndexJump confirmed successful submission.")
          PY

          echo "IndexJump accepted the submission. This does not guarantee Google has indexed the URLs."

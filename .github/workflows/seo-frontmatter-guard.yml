name: SEO Frontmatter Guard

on:
  pull_request:
    paths:
      - 'content/posts/**'
  push:
    paths:
      - 'content/posts/**'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check frontmatter
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in pathlib.Path('content/posts').glob('*.md'):
              t = p.read_text(encoding='utf-8', errors='replace')
              if not t.startswith('---'):
                  bad.append(f'{p}: no frontmatter')
                  continue
              if 'title:' not in t[:500]:
                  bad.append(f'{p}: missing title')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('OK')
          PY

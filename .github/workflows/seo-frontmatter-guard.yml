name: SEO Frontmatter Guard

# SEO normalization is part of the build pipeline. This workflow is manual
# for emergency repair only, so it cannot race a writer or trigger extra builds.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Normalize Post SEO Frontmatter
        run: python scripts/normalize_posts_seo.py

      - name: Commit Changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/posts; then
            echo "No SEO normalization changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add content/posts/*.md
          git diff --staged --quiet && exit 0
          git commit -m "chore(seo): normalize generated post metadata"
          git push origin HEAD:main

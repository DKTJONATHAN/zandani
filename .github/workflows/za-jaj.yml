name: Jaj — Opinion column

on:
  schedule:
    - cron: '48 * * * *'
      timezone: 'Africa/Nairobi'
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: zandani-main-content-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  POSTS_DIR: content/posts
  MEMORY_FILE: .github/memory_jaj.json
  TZ: Africa/Nairobi
  FRESH_HOURS: "24"
  DESK_AUTHOR: "Jaj"
  DESK_CATEGORY: "Opinions"
  DESK_SOURCE: "https://www.kenyans.co.ke/"
  DESK_DOMAIN: "kenyans.co.ke"
  DESK_ROLE: "opinion columnist"
  DESK_AUDIENCE: "Kenyan readers following public debate"

jobs:
  generate-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.ACTIONS_GITHUB_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install inline Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil google-genai Pillow

      - name: Run Opinions desk — GAP + source images
        env:
          GEMINI_WRITE_KEY: ${{ secrets.GEMINI_WRITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          POSTS_DIR: ${{ env.POSTS_DIR }}
          MEMORY_FILE: ${{ env.MEMORY_FILE }}
          FRESH_HOURS: "24"
          WRITER_MAX_AGE_HOURS: "24"
          WRITE_EVERY_ELIGIBLE_STORY: "1"
        run: python scripts/jaj_columnist.py

      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Za Ndani"
          git config user.email "bot@zandani.co.ke"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: opinions desk"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${DEFAULT_BRANCH}"
            git rebase "origin/${DEFAULT_BRANCH}"
            if git push origin HEAD:"${DEFAULT_BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
